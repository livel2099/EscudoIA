server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
spring:
  application:
    name: escudo-ia
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:escudo}}
    username: ${DB_USERNAME:escudo}
    password: ${DB_PASSWORD:escudo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 0B
  lifecycle:
    timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
app:
  ocr:
    command: ${OCR_COMMAND:tesseract}
    language: ${OCR_LANGUAGE:spa+eng}
    timeout-seconds: ${OCR_TIMEOUT_SECONDS:25}
    max-pixels: ${OCR_MAX_PIXELS:8000000}
  jwt:
    secret: ${JWT_ACCESS_SECRET:dev-only-secret-change-me-32-bytes-minimum}
    access-ttl-seconds: ${JWT_ACCESS_TTL:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL:2592000}
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:${RENDER_EXTERNAL_URL:http://localhost:5173,http://localhost:8080}}"
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:60}
  mercado-pago:
    production-mode: ${MP_PRODUCTION_MODE:false}
    mock-mode: ${MP_MOCK_MODE:true}
    checkout-mode: ${MP_CHECKOUT_MODE:API}
    access-token: ${MP_TEST_ACCESS_TOKEN:${MERCADOPAGO_ACCESS_TOKEN:}}
    public-key: ${MP_TEST_PUBLIC_KEY:}
    webhook-url: "${MP_WEBHOOK_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}/api/pagos/webhook}"
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
    api-base-url: https://api.mercadopago.com

