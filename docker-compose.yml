services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: escudo
      POSTGRES_USER: escudo
      POSTGRES_PASSWORD: escudo
    ports:
      - "5432:5432"
    volumes:
      - escudo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escudo -d escudo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  escudo_pgdata:

