databases:
  - name: escudo-db
    plan: free
    databaseName: escudo
    user: escudo

services:
  - type: web
    name: escudo-ia
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    domains:
      - livel.pro
    autoDeployTrigger: commit
    envVars:
      - key: DB_HOST
        fromDatabase: {name: escudo-db, property: host}
      - key: DB_PORT
        fromDatabase: {name: escudo-db, property: port}
      - key: DB_NAME
        fromDatabase: {name: escudo-db, property: database}
      - key: DB_USERNAME
        fromDatabase: {name: escudo-db, property: user}
      - key: DB_PASSWORD
        fromDatabase: {name: escudo-db, property: password}
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 900
      - key: JWT_REFRESH_TTL
        value: 2592000
      - key: FREE_DAILY_SCAN_LIMIT
        value: 10
      - key: FRONTEND_URL
        value: https://livel.pro
      - key: CORS_ALLOWED_ORIGINS
        value: https://livel.pro
      - key: MP_PRODUCTION_MODE
        value: false
      - key: MP_MOCK_MODE
        value: false
      - key: MP_CHECKOUT_MODE
        value: API
      - key: MP_TEST_ACCESS_TOKEN
        sync: false
      - key: MP_TEST_PUBLIC_KEY
        sync: false
      - key: MP_WEBHOOK_URL
        value: https://livel.pro/api/pagos/webhook
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

