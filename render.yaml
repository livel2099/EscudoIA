services:
  - type: web
    name: escudo-ia
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 900
      - key: JWT_REFRESH_TTL
        value: 2592000
      - key: FREE_DAILY_SCAN_LIMIT
        value: 10
      - key: FRONTEND_URL
        fromService:
          type: web
          name: escudo-ia
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: escudo-ia
          envVarKey: RENDER_EXTERNAL_URL
      - key: MP_PRODUCTION_MODE
        value: false
      - key: MP_MOCK_MODE
        value: false
      - key: MP_CHECKOUT_MODE
        value: API
      - key: MP_TEST_ACCESS_TOKEN
        sync: false
      - key: MP_TEST_PUBLIC_KEY
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

